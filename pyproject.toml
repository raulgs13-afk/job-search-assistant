[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobassistant"
version = "0.1.0"
description = "Asistente de búsqueda de empleo con IA"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]